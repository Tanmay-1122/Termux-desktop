# ============================================================
#   Picom Compositor Config — macOS-style blur for terminals
#   Usage: picom --config ~/.config/picom/picom.conf -b
#   Install: pkg install picom
# ============================================================

# ── Backend ──────────────────────────────────────────────────
backend = "glx";
vsync = true;

# ── Blur (dual_kawase ≈ macOS style) ────────────────────────
blur-method = "dual_kawase";
blur-strength = 7;
blur-background = true;
blur-background-frame = true;
blur-background-fixed = false;

# Windows to exclude from blur
blur-background-exclude = [
    "window_type = 'desktop'",
    "window_type = 'dock'",
    "window_type = 'tooltip'",
    "window_type = 'notify'",
    "_GTK_FRAME_EXTENTS@:c"
];

# ── Opacity ────────────────────────────────────────────────
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

# ── Fading ──────────────────────────────────────────────────
fading = true;
fade-delta = 4;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-exclude = [
    "window_type = 'desktop'"
];

# ── Shadows ─────────────────────────────────────────────────
shadow = true;
shadow-blur = 12;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-opacity = 0.3;

shadow-exclude = [
    "name = 'Notification'",
    "name = 'Dock'",
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "_GTK_FRAME_EXTENTS@:c"
];

# ── Window-type overrides ───────────────────────────────────
wintypes:
{
    tooltip = { fade = true; shadow = false; opacity = 0.9; };
    dock = { shadow = false; };
    menu = { opacity = 0.95; };
    popup_menu = { opacity = 0.95; };
    dropdown_menu = { opacity = 0.95; };
};
